server {
  listen 80;
  client_max_body_size 8m;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
  location /api/ { proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  location /uploads/ { proxy_pass http://api:3000; }
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
